<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnapDox — local file conversion</title>
<!-- ?v= busts the browser cache when SnapDox is updated in place. -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ version }}">
</head>
<body>

<header class="masthead">
  <div class="wordmark">Snap<span>Dox</span></div>
  <p class="tagline">Convert documents and images on your own machine. Nothing is uploaded anywhere.</p>
</header>

<main>
  <!-- The input lives outside the dropzone on purpose: nested inside, the
       click it receives from fileInput.click() bubbles straight back into the
       dropzone's own click handler, and browsers refuse to open a file picker
       from that re-entrant call. -->
  <input type="file" id="file-input" multiple hidden>

  <section id="dropzone" class="dropzone" tabindex="0" role="button"
           aria-label="Choose files to convert">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="drop-icon">
      <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/>
    </svg>
    <p class="drop-main">Drop files here, or <span class="link">browse</span></p>
    <p class="drop-sub">Up to {{ max_mb }} MB each · {{ readable|length }} formats readable</p>
  </section>

  <section id="queue" class="queue" aria-live="polite"></section>

  <details class="settings">
    <summary>Conversion settings</summary>
    <div class="settings-grid">
      <label class="wide">
        <span>PDF to Word <em>how much layout to keep</em></span>
        <select id="opt-pdf-layout">
          <option value="flow">Flowing text — paragraphs and images (best for most documents)</option>
          <option value="tables">Detect tables — for invoices, statements, datasheets</option>
          <option value="text">Plain text — no layout, easiest to edit</option>
        </select>
      </label>
      <label>
        <span>Resolution <em>PDF or SVG to image</em></span>
        <input type="number" id="opt-dpi" value="200" min="12" max="1200" step="10">
      </label>
      <label>
        <span>Pages <em>blank for all, e.g. 1-3,7</em></span>
        <input type="text" id="opt-pages" placeholder="all">
      </label>
      <label>
        <span>Quality <em>JPEG and WebP</em></span>
        <input type="number" id="opt-quality" value="92" min="1" max="100">
      </label>
      <label>
        <span>Tracing <em>image to SVG</em></span>
        <select id="opt-trace-mode">
          <option value="color">Full colour</option>
          <option value="bw">Black &amp; white silhouette</option>
        </select>
      </label>
      <label>
        <span>Detail <em>drop specks smaller than</em></span>
        <input type="number" id="opt-speckle" value="4" min="0" max="128">
      </label>
      <label>
        <span>PDF password <em>if the file is locked</em></span>
        <input type="password" id="opt-password" placeholder="none" autocomplete="off">
      </label>
    </div>
  </details>
</main>

<footer>
  <span>SnapDox {{ version }}</span>
  <span class="dot">·</span>
  <span>Reads: {{ readable|join(', ') }}</span>
</footer>

<script src="{{ url_for('static', filename='app.js') }}?v={{ version }}"></script>
</body>
</html>
